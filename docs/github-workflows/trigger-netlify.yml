name: Trigger EOD stock-site refresh

on:
  workflow_dispatch:
  schedule:
    # 23:30 UTC is 7:30 PM New York during daylight time and 6:30 PM in winter.
    # The pipeline must still verify the effective market date and exchange holidays.
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Trigger Netlify build
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl --fail --silent --show-error --retry 2 -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

      - name: Explain missing configuration
        if: ${{ env.NETLIFY_BUILD_HOOK == '' }}
        run: echo "NETLIFY_BUILD_HOOK is not configured; refresh was skipped."
