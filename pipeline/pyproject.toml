[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-research-pipeline"
version = "0.1.0"
description = "Build-time market-data pipeline for Stock Research"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
live = [
  "financedatabase",
  "financetoolkit",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "yfinance",
]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
